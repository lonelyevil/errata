name: Docker

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: Push the SHA-tagged image to GHCR after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test and verify version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run tests
        run: bun run test

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected="v${package_version}"
          if [[ "${RELEASE_TAG}" != "${expected}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match ${expected}" >&2
            exit 1
          fi

  smoke:
    name: Image smoke (${{ matrix.platform }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            port: 17739
          - platform: linux/arm64
            slug: arm64
            port: 17740
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: errata:ci-${{ matrix.slug }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=errata-${{ matrix.slug }}
          cache-to: type=gha,scope=errata-${{ matrix.slug }},mode=max

      - name: Run health, persistence, and architecture checks
        env:
          IMAGE: errata:ci-${{ matrix.slug }}
          CONTAINER: errata-ci-${{ matrix.slug }}
          PORT: ${{ matrix.port }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name "${CONTAINER}" \
            --publish "127.0.0.1:${PORT}:7739" \
            --volume "${CONTAINER}-data:/data" \
            "${IMAGE}"

          wait_for_health() {
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health"; then
                return 0
              fi
              sleep 2
            done
            docker logs "${CONTAINER}"
            return 1
          }

          wait_for_health
          curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:${PORT}/"

          actual_user="$(docker inspect --format '{{.Config.User}}' "${CONTAINER}")"
          [[ "${actual_user}" == "10001:10001" ]]

          actual_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE}")"
          [[ "${actual_platform}" == "${EXPECTED_PLATFORM}" ]]

          docker exec "${CONTAINER}" sh -c 'printf persisted > /data/.docker-smoke'
          docker restart "${CONTAINER}" >/dev/null
          wait_for_health
          docker exec "${CONTAINER}" grep -qx persisted /data/.docker-smoke

  publish:
    name: Publish multi-platform image
    needs: smoke
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' }}
            type=sha

      - name: Build and push linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=errata-multiarch
            type=gha,scope=errata-amd64
            type=gha,scope=errata-arm64
          cache-to: type=gha,scope=errata-multiarch,mode=max

      - name: Verify published manifest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "${image}"
          {
            echo "### Published Docker image"
            echo
            echo "\`${image}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
